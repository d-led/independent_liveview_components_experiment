name: CI · private-service

on:
  push:
    paths:
      - "private_service/**"
      - ".github/workflows/ci-private-service.yml"
  pull_request:
    paths:
      - "private_service/**"
      - ".github/workflows/ci-private-service.yml"

env:
  IMAGE: ghcr.io/${{ github.repository }}/private-service

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private_service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            private_service/deps
            private_service/_build
          key: ${{ runner.os }}-mix-private_service-${{ hashFiles('private_service/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-private_service-

      - run: mix deps.get
      - run: mix test

  docker:
    name: Build · Smoke · Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: private_service
          load: true
          push: false
          tags: smoke-private-service:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke \
            -p 4000:4000 \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            -e RELEASE_COOKIE=smoke-test \
            smoke-private-service:local

          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://localhost:4000/ | grep -q "Sessions Service Dashboard"; then
              echo "✓ Smoke test passed"
              docker stop smoke
              exit 0
            fi
            echo "  attempt $i/30..."
          done

          echo "✗ Smoke test failed — container logs:"
          docker logs smoke
          docker stop smoke
          exit 1

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: private_service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
